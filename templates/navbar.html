{% if current_user.is_authenticated %}
    {# The authenticated navbar, the cool people get this one. #}

    <nav id="navbar">

        <!-- Logo -->
        <a id="navbar-logo" href="/">
            <img src="static/images/kettlelogo.png" alt="Index page">
        </a>

        <div class="navbar-toggle" onclick="toggleNavbar()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Links for nav bar -->
        <div class="links collapsible">
            <a href="{{ url_for('routes.about_route') }}"
           class="{% if request.path == url_for('routes.about_route') %}active-link{% endif %}">About</a>
            <a href="{{ url_for('routes.library_route') }}"
               class="{% if request.path == url_for('routes.library_route') %}active-link{% endif %}">My Library</a>
            <a href="https://trello.com/b/nLR6hiT7/kettle" target="_blank">Trello</a>
            <a href="https://github.com/Icecreamy8229/kettle" target="_blank">Github</a>
            <a href="{{ url_for('routes.logout_route') }}">Logout</a>
        </div>

        <div class="navbar-user-div">
            <p id="navbar-user-alias">{{ current_user.user_alias }} <br> ℗ {{ current_user.user_balance }}</p>
            <a href="{{ url_for('routes.user_route') }}"><img class="navbar-pp" src="{{ get_profile_picture(current_user) }}"></a>
            <a href="{{ url_for('routes.cart_route') }}"><img src="static/images/icons/cart-shopping.svg" alt="cart-icon" class="cart-icon"></a>
        </div>

    </nav>

{% else %}
    {# The guest Navbar #}
    <nav id="navbar">

        <!-- Logo -->
        <a id="navbar-logo" href="/">
            <img src="static/images/kettlelogo.png" alt="Index page">
        </a>

        <div class="navbar-toggle" onclick="toggleNavbar()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Links for nav bar -->
        <div class="links collapsible" style="justify-content: right;">
        <a href="{{ url_for('routes.about_route') }}"
           class="{% if request.path == url_for('routes.about_route') %}active-link{% endif %}">About</a>
        <a href="https://trello.com/b/nLR6hiT7/kettle" target="_blank">Trello</a>
        <a href="https://github.com/Icecreamy8229/kettle" target="_blank">Github</a>
        <a href="{{ url_for('routes.login_route') }}"
        class="login-signup {% if request.path == url_for('routes.login_route') %}active-link{% endif %}">Login / Sign Up</a>
        </div>

    </nav>
{% endif %}
<script src="{{ url_for('static', filename='navbar.js') }}"></script>
