{% extends 'base.html' %}
{% block head %}
   <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
        h2 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        #signup-container {
            display: none;
        }

        #login-container, #signup-container {
            width: 400px !important;
            margin: 50px auto;
            padding: 20px;
            background-color: #343538;
            border-color: #343538;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }

        #login-container img {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #4c1d70;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #371055;
        }

        .btn-secondary {
            background-color: #a1bfbe;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-secondary:hover {
            background-color: #6ea2a9;
        }


        .form-fields {
            width: 100%;
            color: white;
            margin-bottom: 15px;
            background-color: #4A4B4F;
            padding: 10px;
            border: none;
            border-bottom: 1px solid #18191a;
            position: relative;
        }

        .form-fields::placeholder {
            color: white;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
            background-color: #4A4B4F;
        }

        .form-fields:focus::placeholder {
            opacity: 0;
            transform: translateY(-20px);
            background-color: #4A4B4F;
        }

        .form-fields:focus {
            color: white;
            background-color: #4A4B4F;
            outline: none;
            border-bottom: 2px solid #18191a;
            box-shadow: none;

        }

        button {
            margin-top: 10px;
            margin-bottom: 20px;
            margin-left: 5px;
            margin-right: 5px;
            border: none;
            background: none;
        }

        @media (max-width: 480px) {
        #login-container,
        #signup-container {
            width: 90% !important;
            margin: 30px auto;
            padding: 15px;
        }

        .form-fields {
            font-size: 16px;
            padding: 12px;
        }

        .btn-primary,
        .btn-secondary {
            font-size: 14px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            margin: 10px 0;
            width: 100%;
        }

        #login-container img {
            width: 80px;
            margin-bottom: 10px;
        }
    }

    </style>
{% endblock %}

{% block content %}
<body>
    {% include 'navbar.html' %}
    {% include 'flash.html' %}


    <div class="container" style="width: 60%; min-width: 320px" id="login-container">
        <img src="static/images/kettlelogo.png" alt="logo">
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('routes.login_route') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input class="form-fields" type="text" id="username" name="username" placeholder="Username" required>
            <br>
            <input class="form-fields" type="password" id="login-password" name="password" placeholder="Password" required>
            <br>
            <button class="btn btn-primary" type="submit">Login</button>
            <button class="btn btn-secondary" type="button" id="signup-button" onclick="swapForms(this)">Sign Up</button>
        </form>
    </div>


    <div class="container" id="signup-container">
        <h2>Sign Up</h2>
        <form id="signup-form" method="POST" action="{{ url_for('routes.signup_route') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input class="form-fields" type="email" name="email" id="signup-email" placeholder="Email" required>
            <br>
            <input class="form-fields" type="text" name="username" id="signup-username" placeholder="Username" required>
            <br>
            <input class="form-fields" id="signup-alias" name="alias" type="text" placeholder="Alias" required>
            <br>
            <input class="form-fields" type="password" id="signup-password" name="password" placeholder="Password" required>
            <br>
            <input class="form-fields" type="password" id="password-confirm" name="password-confirm" placeholder="Confirm Password" required>
            <br>
            <button class="btn btn-primary" type="submit">Create Account</button>
            <button class="btn btn-secondary" type="button" id="login-button" onclick="swapForms(this)">Login</button>
        </form>
    </div>

</body>

    <script>

        function swapForms(button) {
            const signupForm = document.getElementById('signup-container');
            const loginForm = document.getElementById('login-container');

            if (button.id === "signup-button") {
                loginForm.style.display = "none";
                signupForm.style.display = "block";
            } else {
                loginForm.style.display = "block";
                signupForm.style.display = "none";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const signupForm = document.getElementById("signup-form");

            const fields = [
                { id: "signup-email", message: "A valid email is required." },
                { id: "signup-username", message: "A username is required." },
                { id: "signup-alias", message: "An alias is required." },
                { id: "signup-password", message: "A password is required." },
                { id: "password-confirm", message: "Passwords do not match." }
            ];

            fields.forEach(field => {
                const input = document.getElementById(field.id);
                const errorDiv = document.createElement("div");
                errorDiv.className = "error-message";
                errorDiv.style.color = "red";
                errorDiv.style.fontSize = "14px";
                errorDiv.style.marginTop = "5px";
                input.insertAdjacentElement("afterend", errorDiv);
                field.errorDiv = errorDiv;
            });

            function validatePassword() {
                const passwordInput = document.getElementById("signup-password");
                const passwordErrorDiv = fields.find(f => f.id === "signup-password").errorDiv;
                let errorMessage = "";

                const minLength = 8;
                const specialCharacters = /[^A-Za-z0-9]/;
                const hasNumber = /\d/;
                const hasUppercase = /[A-Z]/;

                if (passwordInput.value.length === 0) {
                    errorMessage = "A password is required.";
                } else if (passwordInput.value.length < minLength) {
                    errorMessage = "Password must be at least 8 characters long.";
                } else if (!hasNumber.test(passwordInput.value)) {
                    errorMessage = "Password must contain at least one number.";
                } else if (!hasUppercase.test(passwordInput.value)) {
                    errorMessage = "Password must contain at least one uppercase letter.";
                } else if (!specialCharacters.test(passwordInput.value)) {
                    errorMessage = "Password must contain a special character.";
                }

                passwordErrorDiv.textContent = errorMessage;
                return errorMessage === "";
            }

            function validateConfirmPassword() {
                const passwordInput = document.getElementById("signup-password");
                const confirmPasswordInput = document.getElementById("password-confirm");
                const confirmPasswordErrorDiv = fields.find(f => f.id === "password-confirm").errorDiv;
                let errorMessage = "";

                if (confirmPasswordInput.value !== passwordInput.value) {
                    errorMessage = "Passwords do not match.";
                }

                confirmPasswordErrorDiv.textContent = errorMessage;
                return errorMessage === "";
            }

            function validateField(field) {
                const input = document.getElementById(field.id);
                field.errorDiv.textContent = input.value.trim() ? "" : field.message;
                return !!input.value.trim();
            }

            fields.forEach(field => {
                document.getElementById(field.id).addEventListener("input", () => validateField(field));
            });

            document.getElementById("signup-password").addEventListener("input", validatePassword);
            document.getElementById("password-confirm").addEventListener("input", validateConfirmPassword);

            signupForm.addEventListener("submit", function (event) {
                let isValid = true;

                fields.forEach(field => {
                    if (!validateField(field)) {
                        isValid = false;
                    }
                });

                if (!validatePassword() || !validateConfirmPassword()) {
                    isValid = false;
                }

                if (!isValid) {
                    event.preventDefault();
                }
            });
        });
        </script>


    
    {% endblock %}
