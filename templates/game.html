{% extends 'base.html' %}
{% block head %}
    <link rel="stylesheet" href="../static/slider.css">
    <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #121212;
                color: #fff;
                margin: 0;
                padding: 0;
            }

            header {
                background-color: #000;
                text-align: center;
                padding: 20px;
            }

            header h1 {
                font-size: 36px;
            }

            header p {
                font-size: 18px;
                color: #5C5C5C;
            }



            /*Placeholder for the carousel */
            #imagePlaceholderContainer {
                text-align: center;
                margin-top: 20px;
            }

            #imagePlaceholder {
                max-width: 100%;
                height: auto;
                display: inline-block;
            }


            #briefDescriptionBox {
                padding: 15px;
                background-color: #343538;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                margin: 20px auto;
                width: 80%;
                max-width: 1200px;
                border: 1px solid #504d54;
                color: #fff;
                text-align: center;
            }

            #briefDescriptionBox p {
                font-size: 16px;
            }

            #genreButtons {
                text-align: center;
                margin: 20px 0;
            }

            .genreButton {
                background-color: #4C1D70;
                color: white;
                border: none;
                padding: 10px 20px;
                margin: 5px;
                cursor: pointer;
                border-radius: 4px;
                font-size: 16px;
                margin-bottom: 60px;
            }

            .genreButton:hover {
                background-color: #6a2c8b;
            }

            #detailedDescriptionBox {
                padding: 20px;
                margin: 20px auto;
                width: 80%;
                max-width: 1200px;
                background-color: #343538;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                border: 1px solid #504d54;
                margin-bottom: 60px;
            }

            #detailedDescriptionBox h2 {
                font-size: 24px;
                margin-top: 0px;
                margin-bottom: 30px;
                text-align: center;
            }

            #detailedDescriptionBox p {
                font-size: 16px;
                line-height: 1.6;
            }

            #addToCartSection {
                text-align: right;
                margin: 20px;
                max-width: 1553px;

            }
            /*i need to put this into a container and move the button to have it align with the
            description still*/
            .button {
                background-color: white;
                color: black;
                padding: 15px 30px;
                border: none;
                font-size: 18px;
                cursor: pointer;

            }

            .button:hover {
                 background-color: #ddd;
            }
        </style>
    <script>
        function addToCart() {
            let gameId = new URLSearchParams(window.location.search).get('id'); // Get game ID from URL
            
            if (!gameId) {
                alert("Game ID is missing!");
                return;
            }
        
            fetch('/add-to-cart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ game_id: gameId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Game added to cart!");
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(error => console.error("Error:", error));
        }

</script>




</script>

{% endblock %}

{% block content %}
    <body>
        {% include 'navbar.html' %}

    
            <header>
                <h1 class="container" id="gameTitle">{{ game.game_title }}</h1>


                <section id="imagePlaceholderContainer">

                    {% include 'slider.html' %}

                </section>
            </header>


    <section id="briefDescriptionBox">
        <p>Need to fix this so its dynamically generated.</p>
    </section>

    <section id="genreButtons">
        <button class="genreButton">Simulation</button>
        <button class="genreButton">Strategy</button>
        <button class="genreButton">Single Player</button>
    </section>

  
    <section id="detailedDescriptionBox">
        <h2>About the Game</h2>

        <p>{{ game.game_desc }}</p>

    </section>




    <section id="addToCartSection">
        <form action="/add-to-cart" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="hidden" name="game_id" value="{{ game.game_id }}"/>
            <button id="addToCartButton" class="button">Add to Cart</button>

        </form>
    </section>

    </body>

{% endblock %}
